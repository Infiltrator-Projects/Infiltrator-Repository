# SPDX-License-Identifier: GPL-3.0-or-later
# Independent of the large APT build and Pages deployment. A single
# authenticated publisher collects release metadata for every OS client.
name: Publish native OS release catalogue
on:
  push:
    branches: [main]
    paths:
      - 'catalogue/apps-source.json'
      - 'scripts/publish-native-installers.py'
      - '.github/workflows/native-os-catalogue.yml'
  repository_dispatch:
    types: [application-release]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: native-os-catalogue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish validated release metadata without touching APT
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/publish-native-installers.py --full-output catalogue/native-installers-v4.json
          # Verify the entire approved provider inventory, not yesterday's
          # fixed repository count. Published and pending must be disjoint.
          jq -e --slurpfile source catalogue/apps-source.json '
            (.releases | length) >= 65 and
            ((.releases | keys) + (.pending | keys) | length) ==
              ((.releases | keys) + (.pending | keys) | unique | length) and
            ((.releases | keys) + (.pending | keys) | sort) ==
              ([$source[0][] | .repo |
                select(startswith("Filesystem-") or startswith("Calendar-") or
                       startswith("Clock-") or . == "Boot" or . == "Calendar" or
                       . == "System-Monitor" or . == "Calculator" or . == "Files" or
                       . == "Defragmenter")] | sort)
          ' catalogue/native-installers-v4.json >/dev/null
          git add catalogue/native-installers-v4.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh authenticated native OS release catalogue'
          git pull --rebase origin main
          git push origin HEAD:main
