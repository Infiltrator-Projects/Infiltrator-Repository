name: Purge reviewed retired branch archive tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-work-branches.yml']
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only old branch-retirement archive refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/refs/tags/archive/branch-retirement-20261111" --jq '.[].ref' | while IFS= read -r ref; do
            case "$ref" in refs/tags/archive/branch-retirement-20261111/*) ;; *) echo "unexpected ref: $ref"; exit 1;; esac
            gh api --method DELETE "repos/$REPO/git/$ref"
            printf 'Retired archive tag: %s\n' "$ref"
          done
