name: Mirror Intune Zabbix Bridge 0.6.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    if: startsWith(github.event.head_commit.message, 'Publish Intune Zabbix Bridge 0.6.0 package mirror')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify universal package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/intune060 mirrored-packages
          curl -fL --retry 5 --retry-delay 2 -o /tmp/intune060/artifacts.zip 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9924-81f5-9e77-4350b5387e8d/raw?se=2026-09-02T05%3A12%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=02d044f9-21ce-50b6-bee9-a92db7ae0989&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T00%3A58%3A59Z&ske=2026-09-03T00%3A58%3A59Z&sks=b&skv=2026-02-06&sig=fzE3hCCFzzGTzcR5r0oGCSCS1M7nwN8ZIezXK%2B8Lcm0%3D'
          unzip -q /tmp/intune060/artifacts.zip -d /tmp/intune060
          deb=/tmp/intune060/intune-zabbix-bridge_0.6.0_all.deb
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = intune-zabbix-bridge
          test "$(dpkg-deb -f "$deb" Version)" = 0.6.0
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          test "$(sha256sum "$deb" | awk '{print $1}')" = 3ec94c39c8d8ecd8dc3143d6c850f41593705cd772f922d5969261a1acd90a9d

          mkdir -p /tmp/intune060/extracted
          dpkg-deb -x "$deb" /tmp/intune060/extracted

          test ! -e /tmp/intune060/extracted/etc/intune-zabbix-bridge/bridge.env
          test -x /tmp/intune060/extracted/usr/lib/intune-zabbix-bridge/import-config
          test -f /tmp/intune060/extracted/usr/lib/systemd/system/intune-zabbix-bridge-import.path
          test -f /tmp/intune060/extracted/usr/share/doc/intune-zabbix-bridge/intune-zabbix-bridge.env.example
          ! grep -R -E -q '^AZURE_(TENANT_ID|CLIENT_ID|CLIENT_SECRET)=.+' /tmp/intune060/extracted/usr/share/doc/intune-zabbix-bridge/intune-zabbix-bridge.env.example
          ! grep -R -E -q '^INTUNE_TELEMETRY_SCRIPT_ID=.+' /tmp/intune060/extracted/usr/share/doc/intune-zabbix-bridge/intune-zabbix-bridge.env.example

          install -m 0644 "$deb" mirrored-packages/intune-zabbix-bridge_0.6.0_all.deb

      - name: Commit universal package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mirrored-packages/intune-zabbix-bridge_0.6.0_all.deb
          git commit -m 'Mirror Intune Zabbix Bridge 0.6.0 universal package'
          git push origin HEAD:main
