name: Publish Beta Repository

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [application-release]
  schedule:
    # Immediate source-project release dispatch is the primary publication
    # trigger. Keep the tokenless five-minute pull as a recovery path if a
    # dispatch token is unavailable or GitHub drops an external event.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repository-wide retrieval, signing and verification is deliberately
    # bounded, with enough headroom for normal upstream/network variance.
    # The heavyweight Mint lifecycle test remains manual-only below.
    concurrency:
      group: pages
      # Never cancel an in-flight repository publication. A later queued run
      # rebuilds from the newest main state after the current signed snapshot
      # has completed, so every deployed repository is internally complete.
      cancel-in-progress: false
    outputs:
      calendar_changed: ${{ steps.release-delta.outputs.calendar_changed }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check out pinned Libraries 1.19.67
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Infiltrator-Projects/Libraries
          ref: de52faaf49e2bbe3c652cab53e56911eb061b4b9
          path: _common

      - name: Check out pinned ssmithnet.net website family
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Infiltrator-Projects/ssmithnet.net
          ref: 989b6a9ddfe46b83156d54fc43cac134b8056cfc
          path: _family

      - name: Verify website family pin
        run: test "$(git -C _family rev-parse HEAD)" = "989b6a9ddfe46b83156d54fc43cac134b8056cfc"

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg jq curl g++

      - name: Build C++17 release tool with COMMON
        run: |
          mkdir -p build
          make -C _common BUILD_DIR="$GITHUB_WORKSPACE/build/common" all
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -I"$GITHUB_WORKSPACE/_common/include" scripts/repository-tool.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/repository-tool

      - name: Materialise verified private package mirrors
        run: build/repository-tool materialize

      - name: Verify repository source contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -pthread -I"$GITHUB_WORKSPACE/_common/include" tests/command_output_test.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/command-output-test
          ./build/command-output-test
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -I"$GITHUB_WORKSPACE/_common/include" tests/apt_index_history_test.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/apt-index-history-test
          ./build/apt-index-history-test
          python3 tests/test_signing.py build/repository-tool
          python3 tests/test_site_setup.py
          python3 tests/test_calendar_candidate.py
          python3 tests/test_publish_workflow.py
          python3 tests/test_private_mirror_policy.py
          python3 tests/test_retention.py build/repository-tool
          python3 tests/test_release_identity.py build/repository-tool
          python3 tests/test_slicer_publication.py build/repository-tool
          python3 tests/test_product_naming.py build/repository-tool
          python3 tests/test_latest_release_deb_coverage.py

      - name: Read currently published Calendar version
        id: previous-calendar
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsSL --max-time 20 \
            https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json \
            | jq -r '.[] | select(.id == "calendar") | (.version // "")' || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Previously published Calendar version: %s\n' "${version:-<none>}"

      - name: Build and verify repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ secrets.APT_SIGNING_KEY_FINGERPRINT }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          build/repository-tool publish --previous-url https://infiltrator-projects.github.io/Infiltrator-Repository
          test -s public/dists/alpha/Release
          test -s public/dists/alpha/main/binary-amd64/Packages.gz
          test -s public/dists/beta/Release
          test -s public/dists/beta/main/binary-amd64/Packages.gz
          test -s public/catalogue/apps.json
          test -s public/catalogue/repository.json
          cmp site/infiltrator-calendar.pref public/infiltrator-calendar.pref
          python3 tests/test_slicer_publication.py --published public

          python3 tests/test_product_naming.py --published public

          # Every published catalogue entry must be present in APT, regardless
          # of whether the application package carries custom artwork.
          while IFS= read -r package_name; do
            grep -Fq "Package: $package_name" public/dists/alpha/main/binary-amd64/Packages
            grep -Fq "Package: $package_name" public/dists/beta/main/binary-amd64/Packages
          done < <(jq -r '.[].package' public/catalogue/apps.json)
          rm -rf public/assets
          mkdir -p public/assets
          cp -a _family/assets/. public/assets/
          cp _common/design/infiltrator-web-v1.css public/assets/infiltrator-web-v1.css
          test -s public/assets/infiltrator-web-v1.css
          test -s public/assets/site.css
          test -s public/assets/site-overrides.css
          test -s public/assets/fonts/mb-corpo-a-cond-regular.woff2
          test -s public/assets/fonts/mb-corpo-s-regular.woff2
          test -s public/assets/fonts/mb-corpo-s-bold.woff2
          python3 _family/tests/check_web_family.py public
          version="$(jq -r '.[] | select(.id == "intune-zabbix-bridge") | .version' public/catalogue/apps.json)"
          test -n "$version"
          mirror="mirrored-packages/intune-zabbix-bridge_${version}_all.deb"
          test -f "$mirror"
          test "$(jq -r '.[] | select(.id == "intune-zabbix-bridge") | .asset' public/catalogue/apps.json)" = "$(basename "$mirror")"

          if grep -q '^Section: oldlibs$' public/dists/beta/main/binary-amd64/Packages; then
            echo 'Unexpected package transition in the current alpha repository' >&2
            exit 1
          fi

      - name: Publish verified 60-component native installer snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish-native-installers.py --output public/catalogue/native-installers.json
          test "$(jq '.releases | length' public/catalogue/native-installers.json)" = 60
          python3 -m json.tool public/catalogue/native-installers.json >/dev/null

      - name: Detect Calendar publication change
        id: release-delta
        env:
          PREVIOUS_VERSION: ${{ steps.previous-calendar.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(jq -r '.[] | select(.id == "calendar") | (.version // "")' public/catalogue/apps.json)"
          test -n "$current"
          changed=false
          if [[ "$current" != "${PREVIOUS_VERSION:-}" ]]; then
            changed=true
          fi
          echo "calendar_changed=$changed" >> "$GITHUB_OUTPUT"
          printf 'Calendar catalogue version: %s (changed=%s)\n' "$current" "$changed"

      - name: Deploy Pages through pinned COMMON
        id: deployment
        continue-on-error: true
        uses: Infiltrator-Projects/Libraries/.github/actions/deploy-pages@de52faaf49e2bbe3c652cab53e56911eb061b4b9
        with:
          path: public
          artifact-name: github-pages-${{ github.run_attempt }}

      # GitHub's artifact API is eventually consistent: upload-pages-artifact
      # can finish before deploy-pages can discover the new artifact. Retry the
      # deployment itself without rebuilding or re-uploading the repository.
      - name: Wait for uploaded Pages artifact visibility
        if: steps.deployment.outcome == 'failure'
        run: sleep 5

      - name: Retry Pages deployment after artifact propagation
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Require Pages deployment success
        if: always()
        shell: bash
        env:
          PRIMARY_OUTCOME: ${{ steps.deployment.outcome }}
          RETRY_OUTCOME: ${{ steps.deployment_retry.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PRIMARY_OUTCOME" == "success" || "$RETRY_OUTCOME" == "success" ]]; then
            exit 0
          fi
          echo "GitHub Pages deployment failed on both the initial attempt and the artifact-visibility retry." >&2
          exit 1

      - name: Verify published Software Centre typography
        run: |
          set -euo pipefail
          BASE="https://infiltrator-projects.github.io/Infiltrator-Repository"
          expected_marker="$(sed -n '/<meta name="infiltrator-build" /p' site/index.html)"
          test -n "$expected_marker"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$BASE/?build=${GITHUB_SHA}" || true)"
            css="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$BASE/assets/site.css?build=${GITHUB_SHA}" || true)"
            if grep -Fq "$expected_marker" <<<"$body" \
              && ! grep -Fq 'raster-card' <<<"$body" \
              && ! grep -Fq 'Cascadia Mono' <<<"$body" \
              && grep -Fq 'font-family:"MB Corpo A"' <<<"$css" \
              && grep -Fq 'font-family:"MB Corpo S"' <<<"$css" \
              && grep -Fq -- '--sans:"MB Corpo S"' <<<"$css" \
              && grep -Fq -- '--display:"MB Corpo A"' <<<"$css"; then
              echo "Published Software Centre is using the canonical MB Corpo website typography."
              exit 0
            fi
            echo "Waiting for Software Centre typography propagation ($attempt/30)..."
            sleep 5
          done
          echo "Published Software Centre did not expose the canonical MB Corpo typography in time." >&2
          exit 1

  signing-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check out pinned Libraries 1.19.67
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Infiltrator-Projects/Libraries
          ref: de52faaf49e2bbe3c652cab53e56911eb061b4b9
          path: _common

      - name: Install signing test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg jq curl g++

      - name: Build C++17 release tool with COMMON
        run: |
          mkdir -p build
          make -C _common BUILD_DIR="$GITHUB_WORKSPACE/build/common" all
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -I"$GITHUB_WORKSPACE/_common/include" scripts/repository-tool.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/repository-tool

      - name: Exercise signing path with disposable key
        run: |
          python3 -m py_compile tests/test_signing.py
          python3 tests/test_signing.py build/repository-tool

  mint-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: build-and-deploy
    # This is intentionally heavyweight: run manually, or explicitly on a promotion push.
    if: >-
      needs.build-and-deploy.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[mint-e2e]'))
      )
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Mint test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl p7zip-full squashfs-tools

      - name: Cache verified Mint 22.3 filesystem
        id: mint-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mint-squashfs/filesystem.squashfs
          key: linuxmint-22.3-cinnamon-filesystem-v1

      - name: Download and verify Linux Mint 22.3 Cinnamon ISO
        if: steps.mint-cache.outputs.cache-hit != 'true'
        env:
          MINT_BASE: https://mirrors.edge.kernel.org/linuxmint/stable/22.3
        run: |
          set -euxo pipefail
          ISO="$RUNNER_TEMP/linuxmint-22.3-cinnamon-64bit.iso"
          mkdir -p "$RUNNER_TEMP/mint-iso" "$RUNNER_TEMP/mint-squashfs"
          curl -fL --retry 5 --retry-delay 5 -o "$ISO" "$MINT_BASE/linuxmint-22.3-cinnamon-64bit.iso"
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/sha256sum.txt" "$MINT_BASE/sha256sum.txt"
          (cd "$RUNNER_TEMP" && grep 'linuxmint-22.3-cinnamon-64bit.iso' sha256sum.txt | sha256sum -c -)
          7z x -y "$ISO" -o"$RUNNER_TEMP/mint-iso" casper/filesystem.squashfs
          mv "$RUNNER_TEMP/mint-iso/casper/filesystem.squashfs" "$RUNNER_TEMP/mint-squashfs/filesystem.squashfs"
          rm -rf "$RUNNER_TEMP/mint-iso" "$ISO" "$RUNNER_TEMP/sha256sum.txt"

      - name: Wait for published beta metadata
        run: |
          set -euo pipefail
          URL='https://infiltrator-projects.github.io/Infiltrator-Repository/dists/beta/Release'
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 "$URL" | grep -q '^Codename: beta$'; then
              exit 0
            fi
            echo "Waiting for Pages propagation ($attempt/30)..."
            sleep 5
          done
          echo 'Published beta metadata did not become available in time' >&2
          exit 1

      - name: Extract clean Linux Mint userspace
        run: |
          set -euxo pipefail
          ROOTFS="$RUNNER_TEMP/mint-root"
          rm -rf "$ROOTFS"
          sudo unsquashfs -processors 2 -d "$ROOTFS" "$RUNNER_TEMP/mint-squashfs/filesystem.squashfs"
          sudo test -f "$ROOTFS/etc/linuxmint/info"
          sudo grep -q '^RELEASE=22.3$' "$ROOTFS/etc/linuxmint/info"
          sudo grep -q '^CODENAME=zena$' "$ROOTFS/etc/linuxmint/info"

      - name: Test APT install upgrade and remove on Mint 22.3
        run: |
          set -euxo pipefail
          ROOTFS="$RUNNER_TEMP/mint-root"

          cleanup() {
            sudo umount -lf "$ROOTFS/dev/pts" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/run" 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount -t sysfs sysfs "$ROOTFS/sys"
          sudo mount -t tmpfs tmpfs "$ROOTFS/run"
          sudo rm -f "$ROOTFS/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$ROOTFS/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod 755 "$ROOTFS/usr/sbin/policy-rc.d"

          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root DEBIAN_FRONTEND=noninteractive bash -euxo pipefail <<'MINT_E2E'
          sed -i '/^[[:space:]]*deb[[:space:]].*cdrom:/d' /etc/apt/sources.list 2>/dev/null || true
          for f in /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sed -i '/^[[:space:]]*deb[[:space:]].*cdrom:/d' "$f"
          done

          echo 'deb [trusted=yes arch=amd64] https://infiltrator-projects.github.io/Infiltrator-Repository beta main' > /etc/apt/sources.list.d/infiltrator-e2e.list
          install -d /etc/apt/preferences.d
          curl -fsSL https://infiltrator-projects.github.io/Infiltrator-Repository/infiltrator-calendar.pref > /etc/apt/preferences.d/infiltrator-calendar
          apt-get update
          curl -fsSL https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json > /tmp/infiltrator-published-apps.json
          published_version() {
            python3 -c 'import json,sys; print(next(a["version"] for a in json.load(open(sys.argv[1])) if a["package"] == sys.argv[2]))' /tmp/infiltrator-published-apps.json "$1"
          }

          for pkg in \
            system-monitor software system-settings calendar calculator defragmenter files \
            infiltratorfs mblink jaglink fordlink audilink bmwlink egypt runnerscope \
            nps-wheres-wally-zabbix intune-zabbix-bridge
          do
            apt-cache policy "$pkg" | grep -q 'https://infiltrator-projects.github.io/Infiltrator-Repository'
          done


          # Consumers also work on an ordinary host without optional modules.
          ! dpkg-query -W -f='${Status}' infiltrator-calendar-resources 2>/dev/null | grep -qx 'install ok installed'
          for pkg in system-settings calendar files; do
            version=$(published_version "$pkg")
            apt-get install -y --no-install-recommends "$pkg=$version"
            ! dpkg-query -W -f='${Status}' infiltrator-calendar-resources 2>/dev/null | grep -qx 'install ok installed'
            if [ "$pkg" = calendar ]; then
              /usr/libexec/calendar-about --print-metadata | grep -qx "version=$version"
              cjs -c 'const C=imports.gi.Calendar; const d=C.CalendarSystem.new("gregorian"); if (!d || !d.format_date(2026,10,18,"short")) throw new Error("normal host calendar unavailable");'
            fi
            apt-get check
            apt-get purge -y "$pkg"
          done

          # Each capability comes from its owning provider repository. Common's
          # SDK release is source-only and is not an APT resource producer.
          provider_specs=$(python3 - <<'PROVIDER_SPECS'
          import json
          entries=json.load(open('/tmp/infiltrator-published-apps.json'))
          providers=[x for x in entries if x['package'].startswith(('infiltrator-calendar-', 'infiltrator-clock-')) and x['package'] != 'infiltrator-calendar-resources']
          assert len(providers) == 54
          print(' '.join(x['package'] + '=' + x['version'] for x in providers))
          PROVIDER_SPECS
          )
          provider_packages=$(printf '%s\n' "$provider_specs" | tr ' ' '\n' | cut -d= -f1 | tr '\n' ' ')
          ! apt-cache show infiltratoros | grep -Eq '^Depends:.*infiltrator-calendar-resources'
          apt-get install -y --no-install-recommends $provider_specs
          for provider_package in $provider_packages; do
            test "$(dpkg-query -W -f='${Status}' "$provider_package")" = 'install ok installed'
          done
          test "$(find /System/Resources/Calendars -maxdepth 1 -name '*.so' | wc -l)" -eq 31
          test "$(find /System/Resources/Clocks -maxdepth 1 -name '*.so' | wc -l)" -eq 23
          for kind in Calendars Clocks; do
            while IFS= read -r module; do
              dpkg-query -S "$module" | grep -Eq '^infiltrator-(calendar|clock)-[^:]+:'
            done < <(find "/System/Resources/$kind" -maxdepth 1 -type f -name '*.so')
          done

          # Alpha packages are qualified by clean installation and removal.
          monitor_version=$(published_version system-monitor)
          apt-get install -y --no-install-recommends "system-monitor=$monitor_version"
          test "$(dpkg-query -W -f='${Version}' system-monitor)" = "$monitor_version"
          test -x /Programs/system-monitor
          apt-get check
          apt-get purge -y system-monitor
          ! dpkg-query -W -f='${db:Status-Abbrev}' system-monitor 2>/dev/null | grep -q '^ii'
          apt-get check
          for pkg in system-settings calendar defragmenter calculator files mblink jaglink fordlink audilink bmwlink; do
            version=$(published_version "$pkg")
            if [ "$pkg" = calendar ]; then
              candidate=$(apt-cache policy calendar | awk '/Candidate:/ {print $2; exit}')
              test "$candidate" = "$version"
            fi
            apt-get install -y --no-install-recommends "$pkg=$version"
            dpkg-query -W -f='${Status}\n' "$pkg" | grep -q '^install ok installed$'
            test "$(dpkg-query -W -f='${Version}' "$pkg")" = "$version"
            if [ "$pkg" = calendar ]; then
              /usr/libexec/calendar-about --print-metadata | grep -qx "version=$version"
            fi
            apt-get check
            case "$pkg" in system-settings|calendar|files)
              # Shared temporal implementations belong to their independent
              # package and must survive every consumer's uninstall scripts.
              for provider_package in $provider_packages; do test "$(dpkg-query -W -f='${Status}' "$provider_package")" = 'install ok installed'; done
              test "$(find /System/Resources/Calendars -maxdepth 1 -name '*.so' | wc -l)" -ge 31
              test "$(find /System/Resources/Clocks -maxdepth 1 -name '*.so' | wc -l)" -ge 23
              sha256sum /System/Resources/Calendars/*.so /System/Resources/Clocks/*.so > /tmp/temporal-resources.sha256
              ;; esac
            apt-get purge -y "$pkg"
            ! dpkg-query -W "$pkg" >/dev/null 2>&1
            case "$pkg" in system-settings|calendar|files)
              for provider_package in $provider_packages; do test "$(dpkg-query -W -f='${Status}' "$provider_package")" = 'install ok installed'; done
              sha256sum --check /tmp/temporal-resources.sha256
              ;; esac
            apt-get check
          done

          # MBLink and JAGLink both consume Link's OpenPort 2.0 support. Prove
          # that their Debian packages are co-installable and own distinct udev
          # rule paths so dpkg cannot regress to a shared-file collision.
          apt-get install -y --no-install-recommends mblink jaglink
          dpkg-query -W -f='${Status}\n' mblink | grep -q '^install ok installed$'
          dpkg-query -W -f='${Status}\n' jaglink | grep -q '^install ok installed$'
          test -f /usr/lib/udev/rules.d/60-mblink-openport2.rules
          test -f /usr/lib/udev/rules.d/60-jaglink-openport2.rules
          test ! -e /usr/lib/udev/rules.d/60-link-openport2.rules
          dpkg-query -S /usr/lib/udev/rules.d/60-mblink-openport2.rules | grep -q '^mblink:'
          dpkg-query -S /usr/lib/udev/rules.d/60-jaglink-openport2.rules | grep -q '^jaglink:'
          apt-get check
          apt-get purge -y mblink jaglink
          ! dpkg-query -W mblink >/dev/null 2>&1
          ! dpkg-query -W jaglink >/dev/null 2>&1
          apt-get check

          # Kernel-bound driver: dependency resolution is tested here; runtime DKMS
          # loading requires a booted Mint kernel and is covered by InfiltratorFS itself.
          apt-get -s install infiltratorfs

          # Zabbix module: repository retrieval and Debian metadata are tested here.
          # Full configuration requires the external Zabbix frontend dependency.
          mkdir -p /tmp/infiltrator-wally-test
          cd /tmp/infiltrator-wally-test
          apt-get download nps-wheres-wally-zabbix
          deb="$(find . -maxdepth 1 -name 'nps-wheres-wally-zabbix*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null
          cd /
          rm -rf /tmp/infiltrator-wally-test
          apt-get check

          # Intune bridge: universal package is public; deployment config remains separate.
          mkdir -p /tmp/infiltrator-intune-bridge-test
          cd /tmp/infiltrator-intune-bridge-test
          apt-get download intune-zabbix-bridge
          deb="$(find . -maxdepth 1 -name 'intune-zabbix-bridge*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = intune-zabbix-bridge
          candidate="$(apt-cache policy intune-zabbix-bridge | awk '/Candidate:/ {print $2; exit}')"
          test -n "$candidate"
          test "$(dpkg-deb -f "$deb" Version)" = "$candidate"
          mkdir extracted
          dpkg-deb -x "$deb" extracted
          test ! -e extracted/etc/intune-zabbix-bridge/bridge.env
          test -x extracted/usr/lib/intune-zabbix-bridge/import-config
          test -f extracted/usr/lib/systemd/system/intune-zabbix-bridge-import.path
          cd /
          rm -rf /tmp/infiltrator-intune-bridge-test
          apt-get check

          MINT_E2E

      - name: Report Mint test result
        run: echo 'Linux Mint 22.3 Cinnamon repository lifecycle test passed'
