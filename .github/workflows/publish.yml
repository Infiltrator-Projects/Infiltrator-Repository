name: Publish Beta Repository

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [application-release]
  workflow_dispatch:
  schedule:
    # Five-minute safety net for source repositories whose cross-repository dispatch token
    # is temporarily unavailable. Package rebuilds reuse the published APT mirror first,
    # so scheduled refreshes do not re-download unchanged GitHub release assets.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Automatic repository publication must complete inside the ten-minute ceiling.
    # The heavyweight Mint lifecycle test is manual-only below.
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      calendar_changed: ${{ steps.release-delta.outputs.calendar_changed }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned Infiltratr Common 1.19.2
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: 44409af17c89b6ece6b4bcb2c0c133213c695c23
          path: _common

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg jq curl g++ imagemagick librsvg2-bin xz-utils

      - name: Build C++17 release tool with COMMON
        run: |
          mkdir -p build
          make -C _common BUILD_DIR="$GITHUB_WORKSPACE/build/common" all
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -I"$GITHUB_WORKSPACE/_common/include" scripts/repository-tool.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/repository-tool

      - name: Materialise verified private package mirrors
        run: build/repository-tool materialize

      - name: Verify repository source contracts
        run: |
          python3 tests/test_site_setup.py
          python3 tests/test_private_mirror_policy.py
          python3 tests/test_retention.py build/repository-tool

      - name: Read currently published Calendar version
        id: previous-calendar
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsSL --max-time 20 \
            https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json \
            | jq -r '.[] | select(.id == "calendar") | (.version // "")' || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Previously published Calendar version: %s\n' "${version:-<none>}"

      - name: Build and verify repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ secrets.APT_SIGNING_KEY_FINGERPRINT }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          build/repository-tool publish
          test -s public/dists/beta/Release
          test -s public/dists/beta/main/binary-amd64/Packages.gz
          test -s public/catalogue/apps.json
          test -s public/catalogue/repository.json
          mkdir -p public/assets
          cp _common/design/infiltrator-web-v1.css public/assets/infiltrator-web-v1.css
          test -s public/assets/infiltrator-web-v1.css
          version="$(jq -r '.[] | select(.id == "intune-zabbix-bridge") | .version' public/catalogue/apps.json)"
          test -n "$version"
          mirror="mirrored-packages/intune-zabbix-bridge_${version}_all.deb"
          test -f "$mirror"
          test "$(jq -r '.[] | select(.id == "intune-zabbix-bridge") | .asset' public/catalogue/apps.json)" = "$(basename "$mirror")"

          monitor_version="$(jq -r '.[] | select(.id == "system-monitor") | .version' public/catalogue/apps.json)"
          monitor_asset="$(jq -r '.[] | select(.id == "system-monitor") | .asset' public/catalogue/apps.json)"
          test -n "$monitor_version"
          test -n "$monitor_asset"
          monitor_package="$(dpkg-deb -f "public/pool/main/$monitor_asset" Package)"
          if [[ "$monitor_package" == "system-monitor" ]]; then
            transition="public/pool/main/linux-system-monitor_${monitor_version}_all.deb"
            test -f "$transition"
            test "$(dpkg-deb -f "$transition" Package)" = "linux-system-monitor"
            test "$(dpkg-deb -f "$transition" Depends)" = "system-monitor (= $monitor_version)"
          elif [[ "$monitor_package" == "infiltrator-system-monitor" ]]; then
            for old in system-monitor linux-system-monitor; do
              transition="public/pool/main/${old}_${monitor_version}_all.deb"
              test -f "$transition"
              test "$(dpkg-deb -f "$transition" Package)" = "$old"
              test "$(dpkg-deb -f "$transition" Depends)" = "infiltrator-system-monitor (= $monitor_version)"
            done
          else
            echo "Unexpected System Monitor package identity: $monitor_package" >&2
            exit 1
          fi

          calendar_version="$(jq -r '.[] | select(.id == "calendar") | .version' public/catalogue/apps.json)"
          calendar_asset="$(jq -r '.[] | select(.id == "calendar") | .asset' public/catalogue/apps.json)"
          test -n "$calendar_version"
          test -n "$calendar_asset"
          calendar_package="$(dpkg-deb -f "public/pool/main/$calendar_asset" Package)"
          test "$calendar_package" = "infiltrator-calendar"
          for candidate in public/pool/main/*.deb; do
            package_name="$(dpkg-deb -f "$candidate" Package)"
            test "$package_name" != "calendar-plus"
            test "$package_name" != "cinnamon-calendar"
          done

          calculator_version="$(jq -r '.[] | select(.id == "infiltrator-calc") | .version' public/catalogue/apps.json)"
          calculator_asset="$(jq -r '.[] | select(.id == "infiltrator-calc") | .asset' public/catalogue/apps.json)"
          test -n "$calculator_version"
          test -n "$calculator_asset"
          if [[ "$(dpkg-deb -f "public/pool/main/$calculator_asset" Package)" == "infiltrator-calculator" ]]; then
            transition="public/pool/main/infiltrator-calc_${calculator_version}_all.deb"
            test -f "$transition"
            test "$(dpkg-deb -f "$transition" Package)" = "infiltrator-calc"
            test "$(dpkg-deb -f "$transition" Depends)" = "infiltrator-calculator (= $calculator_version)"
          fi

          defragger_version="$(jq -r '.[] | select(.id == "defragger") | .version' public/catalogue/apps.json)"
          defragger_asset="$(jq -r '.[] | select(.id == "defragger") | .asset' public/catalogue/apps.json)"
          test -n "$defragger_version"
          test -n "$defragger_asset"
          if [[ "$(dpkg-deb -f "public/pool/main/$defragger_asset" Package)" == "infiltrator-defragmenter" ]]; then
            transition="public/pool/main/linux-defragger_${defragger_version}_all.deb"
            test -f "$transition"
            test "$(dpkg-deb -f "$transition" Depends)" = "infiltrator-defragmenter (= $defragger_version)"
          fi
          test -z "$(find public/pool/main -maxdepth 1 -type f -name 'app-install-data-ssmithnet_*_all.deb' -print -quit)"
          test -z "$(find public/pool/main -maxdepth 1 -type f -name 'infiltrator-app-install-data_*_all.deb' -print -quit)"
          for suite in beta alpha; do
            dep11="public/dists/$suite/main/dep11"
            test -s "$dep11/Components-amd64.yml.gz"
            test -s "$dep11/Components-amd64.yml.xz"
            test -s "$dep11/icons-48x48.tar.gz"
            test -s "$dep11/icons-64x64.tar.gz"
            test -s "$dep11/icons-128x128.tar.gz"
            gzip -cd "$dep11/Components-amd64.yml.gz" | grep -q 'Package: "infiltrator-system-monitor"'
            gzip -cd "$dep11/Components-amd64.yml.gz" | grep -q 'Package: "infiltrator-calendar"'
            tar -tzf "$dep11/icons-64x64.tar.gz" | grep -q 'infiltrator-system-monitor.png'
            tar -tzf "$dep11/icons-64x64.tar.gz" | grep -q 'infiltrator-calendar.png'
            grep -q 'main/dep11/Components-amd64.yml.gz' "public/dists/$suite/Release"
            grep -q 'main/dep11/icons-64x64.tar.gz' "public/dists/$suite/Release"
          done

          runner_version="$(jq -r '.[] | select(.id == "runnerscope") | .version' public/catalogue/apps.json)"
          runner_asset="$(jq -r '.[] | select(.id == "runnerscope") | .asset' public/catalogue/apps.json)"
          test -n "$runner_version"
          test -n "$runner_asset"
          if [[ "$(dpkg-deb -f "public/pool/main/$runner_asset" Package)" == "infiltrator-runner-monitor" ]]; then
            transition="public/pool/main/runnerscope_${runner_version}_all.deb"
            test -f "$transition"
            test "$(dpkg-deb -f "$transition" Depends)" = "infiltrator-runner-monitor (= $runner_version)"
          fi

      - name: Detect Calendar publication change
        id: release-delta
        env:
          PREVIOUS_VERSION: ${{ steps.previous-calendar.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(jq -r '.[] | select(.id == "calendar") | (.version // "")' public/catalogue/apps.json)"
          test -n "$current"
          changed=false
          if [[ "$current" != "${PREVIOUS_VERSION:-}" ]]; then
            changed=true
          fi
          echo "calendar_changed=$changed" >> "$GITHUB_OUTPUT"
          printf 'Calendar catalogue version: %s (changed=%s)\n' "$current" "$changed"

      - name: Deploy Pages through pinned COMMON
        id: deployment
        uses: Infiltrator-Projects/Infiltrator-Libraries/.github/actions/deploy-pages@44409af17c89b6ece6b4bcb2c0c133213c695c23
        with:
          path: public
          artifact-name: github-pages-${{ github.run_attempt }}

  signing-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned Infiltratr Common 1.19.2
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: 44409af17c89b6ece6b4bcb2c0c133213c695c23
          path: _common

      - name: Install signing test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg jq curl g++ imagemagick librsvg2-bin xz-utils

      - name: Build C++17 release tool with COMMON
        run: |
          mkdir -p build
          make -C _common BUILD_DIR="$GITHUB_WORKSPACE/build/common" all
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -I"$GITHUB_WORKSPACE/_common/include" scripts/repository-tool.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/repository-tool

      - name: Exercise signing path with disposable key
        run: |
          python3 -m py_compile tests/test_signing.py
          python3 tests/test_signing.py build/repository-tool

  mint-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: build-and-deploy
    # This is intentionally heavyweight: run manually, or explicitly on a promotion push.
    if: >-
      needs.build-and-deploy.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[mint-e2e]'))
      )
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Mint test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl p7zip-full squashfs-tools

      - name: Cache verified Mint 22.3 filesystem
        id: mint-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mint-squashfs/filesystem.squashfs
          key: linuxmint-22.3-cinnamon-filesystem-v1

      - name: Download and verify Linux Mint 22.3 Cinnamon ISO
        if: steps.mint-cache.outputs.cache-hit != 'true'
        env:
          MINT_BASE: https://mirrors.edge.kernel.org/linuxmint/stable/22.3
        run: |
          set -euxo pipefail
          ISO="$RUNNER_TEMP/linuxmint-22.3-cinnamon-64bit.iso"
          mkdir -p "$RUNNER_TEMP/mint-iso" "$RUNNER_TEMP/mint-squashfs"
          curl -fL --retry 5 --retry-delay 5 -o "$ISO" "$MINT_BASE/linuxmint-22.3-cinnamon-64bit.iso"
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/sha256sum.txt" "$MINT_BASE/sha256sum.txt"
          (cd "$RUNNER_TEMP" && grep 'linuxmint-22.3-cinnamon-64bit.iso' sha256sum.txt | sha256sum -c -)
          7z x -y "$ISO" -o"$RUNNER_TEMP/mint-iso" casper/filesystem.squashfs
          mv "$RUNNER_TEMP/mint-iso/casper/filesystem.squashfs" "$RUNNER_TEMP/mint-squashfs/filesystem.squashfs"
          rm -rf "$RUNNER_TEMP/mint-iso" "$ISO" "$RUNNER_TEMP/sha256sum.txt"

      - name: Wait for published beta metadata
        run: |
          set -euo pipefail
          URL='https://infiltrator-projects.github.io/Infiltrator-Repository/dists/beta/Release'
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 "$URL" | grep -q '^Codename: beta$'; then
              exit 0
            fi
            echo "Waiting for Pages propagation ($attempt/30)..."
            sleep 5
          done
          echo 'Published beta metadata did not become available in time' >&2
          exit 1

      - name: Extract clean Linux Mint userspace
        run: |
          set -euxo pipefail
          ROOTFS="$RUNNER_TEMP/mint-root"
          rm -rf "$ROOTFS"
          sudo unsquashfs -processors 2 -d "$ROOTFS" "$RUNNER_TEMP/mint-squashfs/filesystem.squashfs"
          sudo test -f "$ROOTFS/etc/linuxmint/info"
          sudo grep -q '^RELEASE=22.3$' "$ROOTFS/etc/linuxmint/info"
          sudo grep -q '^CODENAME=zena$' "$ROOTFS/etc/linuxmint/info"

      - name: Test APT install upgrade and remove on Mint 22.3
        run: |
          set -euxo pipefail
          ROOTFS="$RUNNER_TEMP/mint-root"

          cleanup() {
            sudo umount -lf "$ROOTFS/dev/pts" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/run" 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount -t sysfs sysfs "$ROOTFS/sys"
          sudo mount -t tmpfs tmpfs "$ROOTFS/run"
          sudo rm -f "$ROOTFS/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$ROOTFS/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod 755 "$ROOTFS/usr/sbin/policy-rc.d"

          sudo chroot "$ROOTFS" /usr/bin/env HOME=/root DEBIAN_FRONTEND=noninteractive bash -euxo pipefail <<'MINT_E2E'
          sed -i '/^[[:space:]]*deb[[:space:]].*cdrom:/d' /etc/apt/sources.list 2>/dev/null || true
          for f in /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sed -i '/^[[:space:]]*deb[[:space:]].*cdrom:/d' "$f"
          done

          echo 'deb [trusted=yes arch=amd64] https://infiltrator-projects.github.io/Infiltrator-Repository beta main' > /etc/apt/sources.list.d/infiltrator-e2e.list
          apt-get update

          for pkg in system-monitor linux-system-monitor infiltrator-calendar linux-defragger infiltratorfs infiltrator-calc mblink jaglink fordlink audilink bmwlink nps-wheres-wally-zabbix intune-zabbix-bridge; do
            apt-cache policy "$pkg" | grep -q 'https://infiltrator-projects.github.io/Infiltrator-Repository'
          done

          mapfile -t monitor_versions < <(apt-cache madison linux-system-monitor | awk '{print $3}' | awk '!seen[$0]++')
          test "${#monitor_versions[@]}" -ge 2
          latest="${monitor_versions[0]}"
          previous="${monitor_versions[1]}"

          apt-get install -y --no-install-recommends "linux-system-monitor=$previous"
          test "$(dpkg-query -W -f='${Version}' linux-system-monitor)" = "$previous"
          test -x /usr/bin/linux-system-monitor

          apt-get install -y --no-install-recommends "linux-system-monitor=$latest"
          test "$(dpkg-query -W -f='${Version}' linux-system-monitor)" = "$latest"
          test "$(dpkg-query -W -f='${Version}' system-monitor)" = "$latest"
          test -x /usr/bin/system-monitor
          test ! -e /usr/bin/linux-system-monitor
          apt-get check

          apt-get purge -y linux-system-monitor system-monitor
          ! dpkg-query -W linux-system-monitor >/dev/null 2>&1
          ! dpkg-query -W system-monitor >/dev/null 2>&1
          apt-get check

          for pkg in infiltrator-calendar linux-defragger infiltrator-calc mblink jaglink fordlink audilink bmwlink; do
            apt-get install -y --no-install-recommends "$pkg"
            dpkg-query -W -f='${Status}\n' "$pkg" | grep -q '^install ok installed$'
            apt-get check
            apt-get purge -y "$pkg"
            ! dpkg-query -W "$pkg" >/dev/null 2>&1
            apt-get check
          done

          # MBLINK and JAGLINK both consume LINK's OpenPort 2.0 support. Prove
          # that their Debian packages are co-installable and own distinct udev
          # rule paths so dpkg cannot regress to a shared-file collision.
          apt-get install -y --no-install-recommends mblink jaglink
          dpkg-query -W -f='${Status}\n' mblink | grep -q '^install ok installed$'
          dpkg-query -W -f='${Status}\n' jaglink | grep -q '^install ok installed$'
          test -f /usr/lib/udev/rules.d/60-mblink-openport2.rules
          test -f /usr/lib/udev/rules.d/60-jaglink-openport2.rules
          test ! -e /usr/lib/udev/rules.d/60-link-openport2.rules
          dpkg-query -S /usr/lib/udev/rules.d/60-mblink-openport2.rules | grep -q '^mblink:'
          dpkg-query -S /usr/lib/udev/rules.d/60-jaglink-openport2.rules | grep -q '^jaglink:'
          apt-get check
          apt-get purge -y mblink jaglink
          ! dpkg-query -W mblink >/dev/null 2>&1
          ! dpkg-query -W jaglink >/dev/null 2>&1
          apt-get check

          # Kernel-bound driver: dependency resolution is tested here; runtime DKMS
          # loading requires a booted Mint kernel and is covered by InfiltratorFS itself.
          apt-get -s install infiltratorfs

          # Zabbix module: repository retrieval and Debian metadata are tested here.
          # Full configuration requires the external Zabbix frontend dependency.
          mkdir -p /tmp/infiltrator-wally-test
          cd /tmp/infiltrator-wally-test
          apt-get download nps-wheres-wally-zabbix
          deb="$(find . -maxdepth 1 -name 'nps-wheres-wally-zabbix*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null
          cd /
          rm -rf /tmp/infiltrator-wally-test
          apt-get check

          # Intune bridge: universal package is public; deployment config remains separate.
          mkdir -p /tmp/infiltrator-intune-bridge-test
          cd /tmp/infiltrator-intune-bridge-test
          apt-get download intune-zabbix-bridge
          deb="$(find . -maxdepth 1 -name 'intune-zabbix-bridge*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = intune-zabbix-bridge
          candidate="$(apt-cache policy intune-zabbix-bridge | awk '/Candidate:/ {print $2; exit}')"
          test -n "$candidate"
          test "$(dpkg-deb -f "$deb" Version)" = "$candidate"
          mkdir extracted
          dpkg-deb -x "$deb" extracted
          test ! -e extracted/etc/intune-zabbix-bridge/bridge.env
          test -x extracted/usr/lib/intune-zabbix-bridge/import-config
          test -f extracted/usr/lib/systemd/system/intune-zabbix-bridge-import.path
          cd /
          rm -rf /tmp/infiltrator-intune-bridge-test
          apt-get check

          MINT_E2E

      - name: Report Mint test result
        run: echo 'Linux Mint 22.3 Cinnamon repository lifecycle test passed'
