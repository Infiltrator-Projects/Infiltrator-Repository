name: Sync Intune release

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/sync-private-intune.yml'
      - 'scripts/repository-tool.cpp'

# Intune-Zabbix-Bridge is public: this workflow deliberately uses no PAT or
# cross-repository Actions secret to read its release assets.
# A workflow-file push also forces an immediate sync when a release needs publishing now.
permissions:
  contents: write
  actions: write

concurrency:
  group: intune-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out central repository
        uses: actions/checkout@v4

      - name: Check out pinned Infiltratr Common 1.19.35
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: 7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f
          path: _common

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev jq curl g++

      - name: Build C++17 release tool with COMMON
        run: |
          mkdir -p build
          make -C _common BUILD_DIR="$GITHUB_WORKSPACE/build/common" all
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -I"$GITHUB_WORKSPACE/_common/include" scripts/repository-tool.cpp "$GITHUB_WORKSPACE/build/common/libinfiltratr-common.a" -lm -ldl -o build/repository-tool

      - name: Pull and verify latest public Intune release
        run: build/repository-tool sync-intune

      - name: Commit mirror changes when needed
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          git add mirrored-packages/intune-zabbix-bridge_*_all.deb.b64.part-* \
                  mirrored-packages/intune-zabbix-bridge_*_all.deb.sha256
          if git diff --cached --quiet; then
            echo 'Central Intune mirror is already current.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(find mirrored-packages -maxdepth 1 -name 'intune-zabbix-bridge_*_all.deb.sha256' -printf '%f\n' \
            | sed -E 's/^intune-zabbix-bridge_(.*)_all\.deb\.sha256$/\1/' | sort | tail -n 1)"
          version="${version:-unknown}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Mirror Intune Zabbix Bridge ${version} from public release"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # Commits created with GITHUB_TOKEN intentionally do not trigger another
      # push workflow. Dispatch publication explicitly after the verified mirror
      # has landed so Pages/APT cannot race the mirror commit and publish the
      # previous Intune version.
      - name: Publish updated APT repository
        if: steps.mirror.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish.yml --ref main
