name: Verify native release manifest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate real published releases from all 62 repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/publish-native-installers.py --output "$RUNNER_TEMP/native-installers.json"
          python3 - "$RUNNER_TEMP/native-installers.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["schema"] == 1
          assert len(data["releases"]) == 62
          assert sum(k.startswith("Calendar-") for k in data["releases"]) == 31
          assert sum(k.startswith("Clock-") for k in data["releases"]) == 23
          import re
          for repo,release in data["releases"].items():
              if repo.startswith(("Calendar-", "Clock-")):
                  assert re.fullmatch(r"[0-9a-f]{40}", release["target_commitish"])
          assert sum(k.startswith("Filesystem-") for k in data["releases"]) == 4
          assert sum(k in {"System-Monitor","Calculator","Files","Defragmenter"} for k in data["releases"]) == 4
          print("Qualified 62 real release metadata records")
          PY
