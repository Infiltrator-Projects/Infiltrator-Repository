name: Publish Intune 0.6 Now

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: startsWith(github.event.head_commit.message, 'Publish Intune 0.6 now')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg
      - name: Build and verify repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ secrets.APT_SIGNING_KEY_FINGERPRINT }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 scripts/sync-repository.py
          test -s public/dists/alpha/Release
          test -s public/dists/alpha/main/binary-amd64/Packages.gz
          python3 - <<'PY'
          import json
          from pathlib import Path
          apps=json.loads(Path("public/catalogue/apps.json").read_text())
          app=next(a for a in apps if a.get("id")=="intune-zabbix-bridge")
          assert app["version"]=="0.6.0", app
          assert app["asset"]=="intune-zabbix-bridge_0.6.0_all.deb", app
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: intune-060-pages-${{ github.run_attempt }}
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: intune-060-pages-${{ github.run_attempt }}
