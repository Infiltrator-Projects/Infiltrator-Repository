name: Probe secretless private Intune export

on:
  push:
    paths:
      - '.github/workflows/probe-private-intune-action.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out central repository
        uses: actions/checkout@v4

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq dpkg-dev

      - name: Export private Intune DEB without a cross-repository token
        id: intune
        uses: Infiltrator-Projects/Intune-Zabbix-Bridge/.github/actions/export-deb@4c06efbda94c101c360d4c88e079787e9db191f1

      - name: Verify export
        shell: bash
        run: |
          set -euo pipefail
          test -f '${{ steps.intune.outputs.path }}'
          test "$(dpkg-deb --field '${{ steps.intune.outputs.path }}' Version)" = '${{ steps.intune.outputs.version }}'
          test "$(sha256sum '${{ steps.intune.outputs.path }}' | awk '{print $1}')" = '${{ steps.intune.outputs.sha256 }}'
          echo "Secretless private Intune export works for version ${{ steps.intune.outputs.version }}."
