name: Remove redundant audit branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-redundant-branch.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete redundant branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/the-first-infiltrator-forensic-audit"
