name: One-shot site typography migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: "github.event.head_commit.message == 'Add one-shot site typography migration'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
            ('font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;', 'font:15px/1.5 "MB Corpo S Title WEB",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;'),
            ('.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.02em}', '.brand{display:flex;align-items:center;gap:12px;font-family:"MB Corpo A Title Cond WEB","MB Corpo S Title WEB",sans-serif;font-weight:400;letter-spacing:.02em}'),
            ('h1{font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-.045em;margin:9px 0 15px}', 'h1{font-family:"MB Corpo A Title Cond WEB","MB Corpo S Title WEB",sans-serif;font-size:clamp(38px,6vw,64px);font-weight:400;line-height:1.02;letter-spacing:.01em;margin:9px 0 15px}')
          ]
          for old, new in changes:
              if s.count(old) != 1:
                  raise SystemExit('site style contract changed')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'The-First-Infiltrator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'Adopt shared Infiltrator typography in software centre'
          git push origin HEAD:main
